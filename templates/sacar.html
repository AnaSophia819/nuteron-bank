<h1>Realizar Saque</h1>

{% if mensagem %}
    <p role="alert">{{ mensagem }}</p>
{% endif %}

<form action="{{ url_for('sacar') }}" method="post">
    <label>Conta <input name="conta_procurada" required></label>
    <label>Valor <input name="valor" required></label>
    <button type="submit">Sacar</button>
</form>

<a href="{{ url_for('index') }}">Voltar ao menu</a>
