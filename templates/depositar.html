<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Depositar - Nuteron Bank</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>Depositar 💰</h1>

        {% if mensagem %}
            <p role="alert" class="alert">{{ mensagem }}</p>
        {% endif %}

        <form action="{{ url_for('depositar') }}" method="post">
            <div class="form-group">
                <label for="conta_procurada">Número da Conta</label>
                <input type="text" id="conta_procurada" name="conta_procurada" value="{{ conta_procurada or '' }}" placeholder="ex: 12345-6" required>
            </div>

            <div class="form-group">
                <label for="valor">Valor do Depósito (R$)</label>
                <input type="number" step="0.01" id="valor" name="valor" value="{{ valor or '' }}" placeholder="0.00" required>
            </div>

            <button type="submit" class="btn-primary">Confirmar Depósito</button>
        </form>

        <a href="{{ url_for('index') }}" class="btn-secondary">Voltar ao menu</a>
    </div>

</body>
</html>
