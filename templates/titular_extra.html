<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar Novo Titular - Nuteron Bank</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>Cadastrar novo titular 👥</h1>

        {% if mensagem %}
            <p role="alert" class="alert">{{ mensagem }}</p>
        {% endif %}

        <form action="{{ url_for('titular_extra') }}" method="post">
            <div class="form-group">
                <label for="conta_procurada">Número da Conta</label>
                <input type="text" id="conta_procurada" name="conta_procurada" value="{{ conta_procurada or '' }}" placeholder="ex: 12345-6" required>
            </div>

            <div class="form-group">
                <label for="titular_extra">Nome do Novo Titular</label>
                <input type="text" id="titular_extra" name="titular_extra" placeholder="ex: João Silva" required>
            </div>

            <div class="form-group">
                <label for="cpf_extra">CPF do Novo Titular</label>
                <input type="text" id="cpf_extra" name="cpf_extra" placeholder="000.000.000-00" required>
            </div>

            <button type="submit" class="btn-primary">Cadastrar</button>
        </form>

        <a href="{{ url_for('index') }}" class="btn-secondary">Voltar ao menu</a>
    </div>

</body>
</html>
